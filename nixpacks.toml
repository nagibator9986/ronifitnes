# Railway/Nixpacks build configuration
# Builds React frontend and installs Python backend in a single image.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "cd frontend && npm ci",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT --access-logfile - --error-logfile - app:app"

[variables]
FLASK_ENV = "production"
PYTHONUNBUFFERED = "1"
