# Railway / Nixpacks build configuration
# Single image: builds React frontend AND installs Python backend.
# We create an explicit /opt/venv since the "python311" Nix package
# does not expose a bare `pip` binary on PATH.

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "python3.11 -m venv --copies /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip wheel setuptools",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "cd frontend && npm ci"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && /opt/venv/bin/gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT --access-logfile - --error-logfile - app:app"

[variables]
FLASK_ENV = "production"
PYTHONUNBUFFERED = "1"
PATH = "/opt/venv/bin:$PATH"
